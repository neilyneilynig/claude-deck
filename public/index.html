<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Claude Deck</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Claude Deck">
<meta name="theme-color" content="#1c1714">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fbf6ef; --bg2: #f3eadf; --card: #ffffff; --ink: #2c211b; --muted: #8a7a6e; --line: #ecdfd2;
  --clay: #d97757; --clay2: #e8977a; --peach: #fde3d6; --blush: #f4a3a0;
  --green: #5dbb7a; --amber: #e6a23c; --red: #e05d5d;
  --key: #2a221d; --key-ink: #fff4ec; --shadow: 0 1px 0 rgba(0,0,0,.04), 0 8px 24px -12px rgba(120,70,40,.25);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1c1714; --bg2: #241d19; --card: #2a221d; --ink: #fbefe6; --muted: #a8968a; --line: #3a2f28;
  --peach: #4a2c20; --key: #120e0c; --key-ink: #fff4ec; --shadow: 0 1px 0 rgba(255,255,255,.03), 0 10px 30px -14px rgba(0,0,0,.7);
}}
:root[data-theme="dark"] {
  --bg: #1c1714; --bg2: #241d19; --card: #2a221d; --ink: #fbefe6; --muted: #a8968a; --line: #3a2f28;
  --peach: #4a2c20; --key: #120e0c; --key-ink: #fff4ec; --shadow: 0 1px 0 rgba(255,255,255,.03), 0 10px 30px -14px rgba(0,0,0,.7);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font-family: Nunito, ui-rounded, "SF Pro Rounded", system-ui, sans-serif; font-weight: 700;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  min-height: 100dvh; overflow-x: hidden; user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.app { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; max-width: 1400px; margin: 0 auto; }
.col > * { min-width: 0; }
@media (min-width: 900px) {
  .app { grid-template-columns: minmax(300px, 380px) 1fr minmax(260px, 340px); align-items: start; }

}
.col { display: grid; gap: 16px; }
.card { background: var(--card); border-radius: 26px; padding: 18px; box-shadow: var(--shadow); border: 1px solid var(--line); }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0 0 12px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
h2 .count { background: var(--peach); color: var(--clay); border-radius: 99px; padding: 1px 8px; letter-spacing: 0; }

/* ---------- hero ---------- */
.hero { text-align: center; padding: 22px 18px 18px; position: relative; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 0%, var(--peach) 0%, var(--card) 70%); }
.hero .mascot { width: 168px; height: 168px; margin: 4px auto 0; display: block; cursor: pointer; touch-action: manipulation; }
.bubble { display: inline-block; margin-top: 8px; background: var(--card); border: 2px solid var(--line); border-radius: 18px;
  padding: 8px 14px; font-weight: 800; font-size: 16px; position: relative; max-width: 100%; transition: transform .3s; }
.bubble::before { content: ""; position: absolute; top: -9px; left: 50%; transform: translateX(-50%) rotate(45deg);
  width: 14px; height: 14px; background: var(--card); border-left: 2px solid var(--line); border-top: 2px solid var(--line); }
.bubble.pop { animation: pop .45s cubic-bezier(.3,1.6,.5,1); }
.topbar { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
.conn { display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
.conn.on .dot { background: var(--green); box-shadow: 0 0 0 0 var(--green); animation: ping 2s infinite; }
.iconbtn { width: 32px; height: 32px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); font-size: 15px; display: grid; place-items: center; }

/* ---------- mascot ---------- */
.mascot { overflow: visible; }
.mascot .whole { transform-box: view-box; transform-origin: 0 20px; animation: bob 2.6s ease-in-out infinite; }
.mascot .rays { transform-box: view-box; transform-origin: 0 0; transition: transform .4s; }
.mascot .ray { fill: var(--clay); }
.mascot .core { fill: var(--clay); }
.mascot .face { transition: transform .25s ease-out; }
.mascot .eye { fill: #2c1d16; transform-box: fill-box; transform-origin: center; animation: blink 4.2s infinite; }
.mascot .shine { fill: #fff; }
.mascot .cheek { fill: var(--blush); opacity: .8; }
.mascot .mouth { fill: none; stroke: #2c1d16; stroke-width: 2.2; stroke-linecap: round; }
.mascot .mouth-o { fill: #2c1d16; display: none; }
.mascot .zzz, .mascot .sweat, .mascot .sparkles { display: none; }
.mascot.busy .rays { animation: spin var(--spin, 2.8s) linear infinite; }
.mascot.busy .mouth { display: none; }
.mascot.busy .mouth-o { display: block; animation: chomp .5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
.mascot.busy .sparkles { display: block; }
.mascot.busy .whole { animation-duration: 1.1s; }
.mascot.sleep .eye { animation: none; transform: scaleY(.14); }
.mascot.sleep .shine { display: none; }
.mascot.sleep .zzz { display: block; }
.mascot.sleep .whole { animation-duration: 4.5s; }
.mascot.sleep .rays { transform: scale(.92); }
.mascot.stressed .sweat { display: block; animation: drip 1.6s ease-in infinite; }
.mascot.waiting .whole { animation: wiggle .5s ease-in-out infinite; }
.mascot.happy .whole { animation: jump .7s cubic-bezier(.3,1.5,.5,1); }
.mascot.happy .eye { animation: none; transform: scaleY(.25) translateY(-4px); }
.mascot.squish .whole { animation: squish .5s cubic-bezier(.3,1.6,.5,1); }
.zzz text { fill: var(--muted); font-weight: 900; animation: zz 3s ease-in-out infinite; opacity: 0; }
.zzz text:nth-child(2) { animation-delay: 1s; } .zzz text:nth-child(3) { animation-delay: 2s; }
.sparkles path { fill: #f6c85f; transform-box: fill-box; transform-origin: center; animation: twinkle 1.2s ease-in-out infinite; }
.sparkles path:nth-child(2) { animation-delay: .4s; } .sparkles path:nth-child(3) { animation-delay: .8s; }
.sweat { fill: #8fc7ef; }

@keyframes bob { 50% { transform: translateY(-4px) } }
@keyframes spin { to { transform: rotate(360deg) } }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1) } 96% { transform: scaleY(.1) } }
@keyframes chomp { to { transform: scale(.7, .45) } }
@keyframes wiggle { 0%,100% { transform: rotate(-6deg) } 50% { transform: rotate(6deg) } }
@keyframes jump { 0% { transform: translateY(0) scale(1) } 30% { transform: translateY(-22px) scale(1.06, .94) } 60% { transform: translateY(0) scale(1.12, .86) } 100% { transform: none } }
@keyframes squish { 0% { transform: scale(1) } 30% { transform: scale(1.25, .78) } 60% { transform: scale(.9, 1.12) } 100% { transform: scale(1) } }
@keyframes zz { 0% { opacity: 0; transform: translate(0, 0) } 30% { opacity: 1 } 100% { opacity: 0; transform: translate(10px, -22px) } }
@keyframes twinkle { 0%,100% { transform: scale(.3); opacity: .2 } 50% { transform: scale(1); opacity: 1 } }
@keyframes drip { 0% { transform: translateY(0); opacity: 1 } 100% { transform: translateY(10px); opacity: 0 } }
@keyframes pop { 0% { transform: scale(.85) } 100% { transform: scale(1) } }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(93,187,122,.6) } 100% { box-shadow: 0 0 0 8px rgba(93,187,122,0) } }
@keyframes rise { to { transform: translate(var(--dx), -140px) scale(.6); opacity: 0 } }
@keyframes cardIn { from { transform: translateY(14px) scale(.96); opacity: 0 } }
@keyframes glow { 50% { box-shadow: 0 0 0 4px rgba(217,119,87,.18), var(--shadow) } }
@keyframes flash { 0% { background: var(--peach) } 100% { background: var(--card) } }
.heart { position: absolute; pointer-events: none; font-size: 22px; animation: rise 1.4s ease-out forwards; z-index: 5; }

/* ---------- usage ---------- */
.ringwrap { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 16px; align-items: center; }
.ring { position: relative; width: 132px; height: 132px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { stroke: var(--bg2); }
.ring .fill { stroke: var(--clay); stroke-linecap: round; transition: stroke-dashoffset 1s cubic-bezier(.3,1,.4,1), stroke .5s; }
.ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .pct { font-size: 30px; font-weight: 900; line-height: 1; }
.ring .lbl { font-size: 11px; color: var(--muted); margin-top: 3px; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--bg2); border-radius: 16px; padding: 10px 12px; }
.stat b { display: block; font-size: clamp(16px, 4.6vw, 20px); font-weight: 900; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); }
.reset { margin-top: 12px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 54px; margin-top: 14px; }
.bars i { flex: 1; background: var(--clay2); border-radius: 4px 4px 2px 2px; min-height: 3px; opacity: .55; transition: height .8s cubic-bezier(.3,1.4,.5,1); }
.bars i:last-child { opacity: 1; background: var(--clay); }
.barlbl { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 4px; }
.speed { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; color: var(--muted); }
.speed .meter { flex: 1; height: 8px; border-radius: 9px; background: var(--bg2); overflow: hidden; }
.speed .meter i { display: block; height: 100%; width: 0; border-radius: 9px; background: linear-gradient(90deg, var(--clay2), var(--clay)); transition: width .8s; }
.week { display: flex; gap: 6px; margin-top: 14px; }
.week div { flex: 1; text-align: center; font-size: 10px; color: var(--muted); }
.week i { display: block; height: 36px; border-radius: 8px; background: var(--bg2); margin-bottom: 4px; position: relative; overflow: hidden; }
.week i::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: var(--h); background: var(--clay2); border-radius: 8px; transition: height .8s; }
.week div:last-child i::after { background: var(--clay); }

/* ---------- sessions ---------- */
.sessions { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.sess { background: var(--card); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); padding: 14px; animation: cardIn .45s cubic-bezier(.3,1.4,.5,1); transition: border-color .3s; }
.sess.busy { animation: cardIn .45s cubic-bezier(.3,1.4,.5,1), glow 2.4s ease-in-out infinite; border-color: rgba(217,119,87,.45); }
.sess.flash { animation: flash 1.6s ease-out; }
.sess .row { display: flex; gap: 12px; align-items: center; cursor: pointer; }
.sess .mascot { width: 52px; height: 52px; flex: none; }
.sess .meta { flex: 1; min-width: 0; }
.sess .title { font-weight: 900; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sess .sub { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; margin-top: 2px; flex-wrap: wrap; }
.pill { font-size: 11px; font-weight: 900; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.pill.busy { background: var(--peach); color: var(--clay); }
.pill.idle { background: rgba(93,187,122,.16); color: var(--green); }
.pill.waiting { background: rgba(230,162,60,.18); color: var(--amber); }
.activity { margin-top: 10px; font-size: 13px; background: var(--bg2); border-radius: 14px; padding: 8px 12px; display: flex; gap: 8px; align-items: center; }
.activity span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.activity .ago { flex: none !important; color: var(--muted); font-size: 11px; }
.ctx { height: 5px; border-radius: 9px; background: var(--bg2); margin-top: 10px; overflow: hidden; }
.ctx i { display: block; height: 100%; background: var(--green); border-radius: 9px; transition: width .8s; }
.ctxlbl { font-size: 10px; color: var(--muted); margin-top: 3px; display: flex; justify-content: space-between; }
.drawer { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s cubic-bezier(.3,1,.4,1); }
.sess.open .drawer { grid-template-rows: 1fr; }
.drawer > div { overflow: hidden; }
.convo { font-size: 13px; margin-top: 12px; display: grid; gap: 6px; }
.convo p { margin: 0; padding: 8px 12px; border-radius: 14px; line-height: 1.35; font-weight: 600; max-height: 6.2em; overflow: hidden; }
.convo .you { background: var(--bg2); justify-self: end; border-bottom-right-radius: 4px; max-width: 88%; }
.convo .cl { background: var(--peach); border-bottom-left-radius: 4px; max-width: 92%; }
.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.say { display: flex; gap: 8px; margin-top: 10px; }
.say input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 12px 14px; border-radius: 16px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); outline: none; user-select: text; -webkit-user-select: text; }
.say input:focus { border-color: var(--clay); }
.say button { background: var(--clay); color: #fff; border-radius: 16px; padding: 0 18px; font-weight: 900; }
.empty { text-align: center; padding: 30px 10px; color: var(--muted); }
.empty .mascot { width: 90px; height: 90px; margin: 0 auto 6px; display: block; }

/* ---------- deck keys ---------- */
.deck { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (min-width: 900px) { .deck { grid-template-columns: repeat(3, 1fr); } }
.key { aspect-ratio: 1; background: var(--key); color: var(--key-ink); border-radius: 18px; display: grid; place-content: center; text-align: center;
  box-shadow: inset 0 -4px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08), 0 6px 14px -8px rgba(0,0,0,.5);
  transition: transform .08s, box-shadow .08s, background .2s; position: relative; overflow: hidden; touch-action: manipulation; }
.key .e { font-size: 26px; line-height: 1; }
.key .l { font-size: 10px; margin-top: 5px; opacity: .75; font-weight: 800; padding: 0 4px; }
.key:active, .key.pressed { transform: translateY(2px) scale(.96); box-shadow: inset 0 -1px 0 rgba(0,0,0,.35), 0 2px 6px -4px rgba(0,0,0,.5); }
.key.hot { background: var(--clay); }
.key::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255,200,170,.55), transparent 60%); opacity: 0; transition: opacity .5s; }
.key.pressed::after { opacity: 1; transition: none; }
.keys .key { aspect-ratio: auto; padding: 10px 2px; border-radius: 16px; }
.keys .key .e { font-size: 20px; }

/* ---------- toast & sheet ---------- */
.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translate(-50%, 120px); background: var(--ink); color: var(--bg);
  padding: 12px 18px; border-radius: 18px; font-weight: 800; z-index: 20; transition: transform .35s cubic-bezier(.3,1.5,.5,1); max-width: calc(100vw - 32px); }
.toast.show { transform: translate(-50%, 0); }
.toast.err { background: var(--red); color: #fff; }
.toast pre { margin: 8px 0 0; font-size: 12px; white-space: pre-wrap; max-height: 40vh; overflow: auto; font-family: ui-monospace, monospace; font-weight: 500; user-select: text; -webkit-user-select: text; }
.sheet-bg { position: fixed; inset: 0; background: rgba(20,12,8,.45); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .25s; }
.sheet-bg.show { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--card); border-radius: 28px 28px 0 0; padding: 20px 16px max(20px, env(safe-area-inset-bottom));
  max-height: 75dvh; overflow: auto; transform: translateY(105%); transition: transform .35s cubic-bezier(.3,1.2,.5,1); max-width: 640px; margin: 0 auto; }
.sheet.show { transform: none; }
.sheet h3 { margin: 0 0 12px; font-size: 20px; font-weight: 900; }
.proj { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.proj button { background: var(--bg2); border-radius: 16px; padding: 14px 12px; text-align: left; font-weight: 800; }
.proj button:active { background: var(--peach); }

.pairing { max-width: 420px; margin: 12vh auto; text-align: center; }
.pairing .mascot { width: 140px; height: 140px; }
.pairing code { background: var(--bg2); padding: 2px 8px; border-radius: 8px; }
/* ---------- pet stats ---------- */
.petrow { display: flex; justify-content: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.chip { background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 4px 11px; font-size: 12px; font-weight: 900; white-space: nowrap; }
.chip.lv { background: var(--clay); color: #fff; border-color: transparent; }
.xp { height: 7px; border-radius: 9px; background: var(--bg2); margin: 10px auto 0; max-width: 240px; overflow: hidden; }
.xp i { display: block; height: 100%; width: 0; border-radius: 9px; background: linear-gradient(90deg, #f6c85f, var(--clay)); transition: width 1s; }
.xplbl { font-size: 10px; color: var(--muted); margin-top: 3px; }
.timerchip { display: none; margin-top: 10px; }
.timerchip.on { display: inline-flex; gap: 8px; align-items: center; background: var(--peach); color: var(--clay); border-radius: 99px; padding: 5px 6px 5px 12px; font-weight: 900; font-variant-numeric: tabular-nums; }
.timerchip button { background: var(--card); border-radius: 99px; width: 24px; height: 24px; font-size: 11px; }
.mascot .acc { display: none; }
.mascot .acc.on { display: block; }
.mascot .acc.on .bob { animation: hatbob 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
@keyframes hatbob { 50% { transform: rotate(-6deg) } }

/* ---------- projects ---------- */
.projs { margin-top: 14px; display: grid; gap: 6px; }
.projs .p { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: 12px; align-items: center; }
.projs .p span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.projs .p b { font-variant-numeric: tabular-nums; }
.projs .p i { grid-column: 1 / -1; height: 5px; border-radius: 9px; background: var(--clay2); opacity: .8; transition: width .8s; }

/* ---------- pending prompt ---------- */
.pending { margin-top: 12px; border: 2px dashed var(--amber); border-radius: 18px; padding: 12px; background: rgba(230,162,60,.08); }
.pending .q { font-size: 14px; font-weight: 800; line-height: 1.35; }
.pending .hd { font-size: 11px; color: var(--amber); text-transform: uppercase; letter-spacing: .1em; font-weight: 900; margin-bottom: 4px; }
.pending pre { font-size: 11px; white-space: pre-wrap; max-height: 160px; overflow: auto; background: var(--bg2); border-radius: 10px; padding: 8px; margin: 8px 0 0; font-family: ui-monospace, monospace; user-select: text; -webkit-user-select: text; }
.opts { display: grid; gap: 6px; margin-top: 10px; }
.opts button { text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; font-weight: 800; display: flex; gap: 10px; align-items: center; transition: transform .1s; }
.opts button:active { transform: scale(.97); border-color: var(--amber); }
.opts button b { background: var(--amber); color: #fff; border-radius: 8px; min-width: 24px; height: 24px; display: grid; place-items: center; font-size: 13px; }

/* ---------- macros & feed ---------- */
.macros { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; padding-bottom: 2px; scrollbar-width: none; }
.macros::-webkit-scrollbar { display: none; }
.macros button { flex: none; background: var(--bg2); border-radius: 99px; padding: 7px 12px; font-size: 13px; font-weight: 800; white-space: nowrap; transition: transform .1s; }
.macros button:active { transform: scale(.94); background: var(--peach); }
.feedbtn { margin-top: 10px; width: 100%; background: var(--bg2); border-radius: 14px; padding: 9px; font-size: 13px; font-weight: 800; color: var(--muted); }
.feed { display: none; margin-top: 8px; max-height: 340px; overflow-y: auto; gap: 6px; font-size: 12px; overscroll-behavior: contain; }
.sess.feedon .feed { display: grid; }
.feed .you, .feed .claude { padding: 7px 11px; border-radius: 12px; line-height: 1.35; font-weight: 600; white-space: pre-wrap; word-break: break-word; user-select: text; -webkit-user-select: text; }
.feed .you { background: var(--bg2); justify-self: end; max-width: 88%; }
.feed .claude { background: var(--peach); max-width: 94%; }
.feed .tool { color: var(--muted); font-size: 11px; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.feed .err { color: var(--red); font-size: 11px; padding: 0 6px; }
.mic { background: var(--bg2) !important; color: var(--ink) !important; padding: 0 14px !important; }
.mic.rec { background: var(--red) !important; color: #fff !important; animation: glow 1s infinite; }

/* ---------- vitals & servers ---------- */
.vitals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.gauge { text-align: center; font-size: 11px; color: var(--muted); }
.gauge svg { width: 100%; max-width: 70px; display: block; margin: 0 auto; transform: rotate(-90deg); }
.gauge .g-track { stroke: var(--bg2); } .gauge .g-fill { stroke: var(--green); stroke-linecap: round; transition: stroke-dashoffset .8s, stroke .4s; }
.gauge .g-val { font-size: 13px; letter-spacing: -.02em; font-weight: 900; color: var(--ink); margin-top: -46px; height: 40px; display: grid; place-items: center; }
.vfoot { font-size: 11px; color: var(--muted); margin-top: 10px; display: flex; justify-content: space-between; }
.servers { display: grid; gap: 6px; }
.srv { display: flex; align-items: center; gap: 10px; background: var(--bg2); border-radius: 14px; padding: 8px 12px; font-size: 13px; text-decoration: none; color: inherit; }
.srv .port { font-weight: 900; color: var(--clay); font-variant-numeric: tabular-nums; min-width: 48px; }
.srv .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srv small { color: var(--muted); font-size: 10px; }
.srv.lan:active { background: var(--peach); }

/* ---------- settings ---------- */
.set { display: grid; gap: 16px; }
.set label { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-weight: 800; }
.set input[type=range] { flex: 1; accent-color: var(--clay); }
.toggle { width: 50px; height: 30px; border-radius: 99px; background: var(--bg2); position: relative; flex: none; transition: background .2s; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .25s cubic-bezier(.3,1.5,.5,1); }
.toggle.on { background: var(--clay); } .toggle.on::after { transform: translateX(20px); }
.hint { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: -8px; }
.hint a { color: var(--clay); word-break: break-all; }
.medit { display: grid; gap: 6px; }
.medit .m { display: grid; grid-template-columns: 44px minmax(0, 1fr) 36px; gap: 6px; align-items: center; background: var(--bg2); border-radius: 12px; padding: 6px; font-size: 13px; }
.medit .m div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .medit .m small { color: var(--muted); }
.medit .m button { height: 32px; border-radius: 10px; background: var(--card); }
.madd { display: grid; grid-template-columns: 52px 1fr; gap: 6px; }
.madd input, .madd textarea { font: inherit; font-size: 16px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px; padding: 8px 10px; outline: none; user-select: text; -webkit-user-select: text; min-width: 0; }
.madd textarea { grid-column: 1 / -1; resize: vertical; min-height: 60px; }
.madd button { grid-column: 1 / -1; background: var(--clay); color: #fff; border-radius: 12px; padding: 10px; font-weight: 900; }
/* ---------- session stats & files ---------- */
.sstats { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.sstats span { font-size: 11px; font-weight: 800; background: var(--bg2); border-radius: 99px; padding: 3px 9px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sstats span.money { background: var(--peach); color: var(--clay); }
.touched { margin-top: 10px; font-size: 11px; color: var(--muted); display: flex; gap: 5px; flex-wrap: wrap; }
.touched code { background: var(--bg2); border-radius: 8px; padding: 2px 7px; font-family: ui-monospace, monospace; color: var(--ink); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sess .keys { grid-template-columns: repeat(5, 1fr); gap: 6px; }
.sess .keys .key .l { font-size: 9px; }

/* ---------- diff viewer ---------- */
.diffstat { font-size: 12px; color: var(--muted); margin: -4px 0 10px; }
.dfile { margin-top: 12px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.dfile summary { padding: 9px 12px; background: var(--bg2); font-size: 13px; font-weight: 800; cursor: pointer; display: flex; gap: 8px; align-items: center; list-style: none; }
.dfile summary::-webkit-details-marker { display: none; }
.dfile summary .fn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, monospace; }
.dfile summary .add { color: var(--green); } .dfile summary .del { color: var(--red); }
.dcode { margin: 0; font-family: ui-monospace, monospace; font-size: 11px; line-height: 1.5; overflow-x: auto; padding: 6px 0; user-select: text; -webkit-user-select: text; }
.dcode div { padding: 0 12px; white-space: pre; min-width: max-content; }
.dcode .a { background: rgba(93,187,122,.16); } .dcode .d { background: rgba(224,93,93,.16); } .dcode .h { color: #7c9cff; font-weight: 700; }

/* ---------- recent ---------- */
.recent { display: grid; gap: 8px; margin-top: 12px; }
.rec { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 10px 12px; }
.rec .meta { flex: 1; min-width: 0; }

.rec .s { font-size: 11px; color: var(--muted); margin-top: 2px; }

.rec button:active { transform: scale(.95); }
.morebtn { width: 100%; margin-top: 8px; font-size: 12px; color: var(--muted); padding: 6px; }

/* ---------- media & clipboard ---------- */
.player { display: flex; align-items: center; gap: 10px; background: var(--bg2); border-radius: 16px; padding: 10px 12px; margin-top: 14px; }
.player .np { flex: 1; min-width: 0; font-size: 12px; }

.player .np span { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.mbtns { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 8px; }
.mbtns button, .clipbtns button { background: var(--bg2); border-radius: 12px; padding: 9px 0; font-size: 16px; transition: transform .1s; }
.mbtns button:active, .clipbtns button:active { transform: scale(.92); background: var(--peach); }
.vol { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); margin-top: 8px; }
.vol .meter { flex: 1; height: 6px; border-radius: 9px; background: var(--bg2); overflow: hidden; }
.vol .meter i { display: block; height: 100%; background: var(--clay2); border-radius: 9px; transition: width .4s; }
.clipbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; }
.clipbtns button { font-size: 12px; font-weight: 800; padding: 10px 6px; }
.cliptext { width: 100%; min-height: 120px; font: inherit; font-size: 15px; font-weight: 600; border: 2px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 14px; padding: 10px; user-select: text; -webkit-user-select: text; resize: vertical; }
.sheetbtns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.sheetbtns button { flex: 1; background: var(--clay); color: #fff; border-radius: 14px; padding: 11px; font-weight: 900; min-width: 120px; }
.sheetbtns button.ghost { background: var(--bg2); color: var(--ink); }

/* ---------- activity & today ---------- */
.log { display: grid; gap: 4px; max-height: 260px; overflow-y: auto; }
.log div { display: flex; gap: 8px; font-size: 12px; align-items: baseline; padding: 4px 2px; border-bottom: 1px dashed var(--line); }
.log div:last-child { border-bottom: 0; }
.log span:nth-child(2) { flex: 1; min-width: 0; }
.log small { color: var(--muted); font-size: 10px; flex: none; }
.today { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.today div { background: var(--bg2); border-radius: 14px; padding: 10px 6px; text-align: center; }
.today b { display: block; font-size: 18px; font-weight: 900; font-variant-numeric: tabular-nums; }
.today span { font-size: 10px; color: var(--muted); }
.todayline { font-size: 13px; margin-top: 10px; text-align: center; color: var(--muted); font-weight: 700; }

/* ---------- pet colors ---------- */
:root { --pet: var(--clay); }
:root[data-pet="pink"] { --pet: #ec6fa0; } :root[data-pet="sky"] { --pet: #5aa9e6; } :root[data-pet="mint"] { --pet: #4fc59a; }
:root[data-pet="grape"] { --pet: #9b7be0; } :root[data-pet="gold"] { --pet: #e8b33a; }
.mascot .ray, .mascot .core { fill: var(--pet); }
:root[data-pet="rainbow"] .mascot .rays, :root[data-pet="rainbow"] .mascot .core { animation: rainbow 4s linear infinite; }
@keyframes rainbow { to { filter: hue-rotate(360deg); } }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 44px; height: 44px; border-radius: 50%; border: 3px solid transparent; position: relative; font-size: 11px; color: #fff; font-weight: 900; display: grid; place-items: center; }
.swatch.on { border-color: var(--ink); }

.swatch.rainbow { background: conic-gradient(#e05d5d, #e8b33a, #4fc59a, #5aa9e6, #9b7be0, #ec6fa0, #e05d5d); }
.petname { font: inherit; font-size: 16px; font-weight: 800; border: 2px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px; padding: 8px 12px; width: 160px; user-select: text; -webkit-user-select: text; }

/* ---------- task launcher & search ---------- */
.tasktext { width: 100%; min-height: 70px; font: inherit; font-size: 16px; font-weight: 600; border: 2px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 14px; padding: 10px 12px; margin-bottom: 12px; user-select: text; -webkit-user-select: text; resize: vertical; }

.searchbox { display: flex; gap: 8px; margin-top: 12px; }
.searchbox input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 11px 14px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); color: var(--ink); user-select: text; -webkit-user-select: text; }
.searchbox button { background: var(--clay); color: #fff; border-radius: 16px; padding: 0 16px; font-weight: 900; }
.results { display: grid; gap: 8px; margin-top: 8px; }
.result { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 10px 12px; }
.result .top { display: flex; gap: 8px; align-items: center; }
.result .t { flex: 1; min-width: 0; font-weight: 800; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result .s { font-size: 11px; color: var(--muted); }
.result p { margin: 6px 0 0; font-size: 12px; font-weight: 600; line-height: 1.35; background: var(--bg2); border-radius: 10px; padding: 6px 9px; }
.result p mark { background: rgba(246,200,95,.55); color: inherit; border-radius: 3px; padding: 0 1px; }
.result button { background: var(--peach); color: var(--clay); border-radius: 12px; padding: 6px 10px; font-weight: 900; font-size: 12px; flex: none; }

/* ---------- live screen & game ---------- */
.screenimg { width: 100%; border-radius: 14px; display: block; background: var(--bg2); min-height: 120px; }
.live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--red); margin-right: 6px; animation: ping 1.5s infinite; vertical-align: middle; }
.game { position: relative; touch-action: none; }
.game canvas { width: 100%; height: min(60dvh, 520px); display: block; border-radius: 18px; background: linear-gradient(180deg, var(--peach), var(--bg2)); }
.game .hud { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; justify-content: space-between; font-weight: 900; pointer-events: none; }
.game .over { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 8px; background: rgba(28,23,20,.55); border-radius: 18px; color: #fff; }
.game .over[hidden] { display: none; }
.game .over b { font-size: 34px; } .game .over button { background: var(--clay); color: #fff; border-radius: 14px; padding: 12px 22px; font-weight: 900; margin-top: 6px; }
.kbd { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; }
.kbd kbd { background: var(--bg2); border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 8px; padding: 2px 8px; font-family: ui-monospace, monospace; font-weight: 800; text-align: center; }
.sess.current { outline: 3px solid var(--clay); outline-offset: 2px; }
.key.armed { background: var(--red); }

.confetti { position: fixed; top: -20px; font-size: 18px; pointer-events: none; z-index: 40; animation: fall var(--t, 2.4s) linear forwards; }
@keyframes fall { to { transform: translate(var(--dx, 0), 110vh) rotate(var(--r, 360deg)); } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>

<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<div class="sheet-bg" id="sheetbg"></div>
<div class="sheet" id="sheet"></div>
<script>
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- token ----------
const qs = new URLSearchParams(location.search);
let token = qs.get('t');
try { if (token) localStorage.setItem('deck-token', token); else token = localStorage.getItem('deck-token'); } catch {}
if (qs.get('t')) history.replaceState(null, '', location.pathname);

// ---------- mascot ----------
// hats the hero unlocks as you level up (plus a nightcap after midnight)
const ACCESSORIES = `
  <g class="acc" data-acc="bow"><g class="bob">
    <path d="M 14 -27 l -9 -7 v 14 z" fill="#f472b6"/><path d="M 14 -27 l 9 -7 v 14 z" fill="#f472b6"/><circle cx="14" cy="-27" r="3.2" fill="#ec4899"/></g></g>
  <g class="acc" data-acc="party"><g class="bob">
    <path d="M -13 -23 L 2 -62 L 15 -22 Q 1 -17 -13 -23 z" fill="#7c9cff"/>
    <path d="M -8 -36 L 11 -33 M -4 -47 L 8 -45" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    <circle cx="2" cy="-63" r="5" fill="#f6c85f"/></g></g>
  <g class="acc" data-acc="crown"><g class="bob">
    <path d="M -16 -24 L -18 -46 L -8 -36 L 0 -52 L 8 -36 L 18 -46 L 16 -24 Q 0 -19 -16 -24 z" fill="#f6c85f" stroke="#e0a82e" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="0" cy="-30" r="2.6" fill="#e05d5d"/><circle cx="-9" cy="-29" r="1.8" fill="#7c9cff"/><circle cx="9" cy="-29" r="1.8" fill="#5dbb7a"/></g></g>
  <g class="acc" data-acc="nightcap"><g class="bob">
    <path d="M -18 -21 Q -8 -52 16 -50 Q 34 -46 38 -26 Q 26 -40 18 -36 Q 22 -28 18 -21 Q 0 -15 -18 -21 z" fill="#6b7fd7"/>
    <path d="M -18 -21 Q 0 -15 18 -21" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="38" cy="-25" r="5" fill="#fff"/></g></g>`;
function mascot(cls = '', acc = false) {
  const lens = [44, 37, 42, 35, 45, 38, 41, 36, 44, 39, 42, 36];
  let rays = '';
  lens.forEach((L, i) => {
    const a = i * 30 + (i % 3) * 4 - 4;
    rays += `<rect class="ray" x="-5.2" y="${-L}" width="10.4" height="${L - 8}" rx="5.2" transform="rotate(${a})"/>`;

        <path class="mouth" d="M -4.5 6.5 Q 0 11 4.5 6.5"/>
        <ellipse class="mouth-o" cx="0" cy="8" rx="3" ry="3.2"/>
      </g>
      <path class="sweat" d="M 22 -20 q 4 6 0 8 q -4 -2 0 -8 z"/>
      ${acc ? ACCESSORIES : ''}
    </g>
    <g class="zzz"><text x="24" y="-26" font-size="12">z</text><text x="30" y="-36" font-size="15">z</text><text x="38" y="-48" font-size="18">Z</text></g>
    <g class="sparkles">
      <path d="M -46 -30 l 2 -6 l 2 6 l 6 2 l -6 2 l -2 6 l -2 -6 l -6 -2 z"/>
      <path d="M 44 -40 l 1.5 -4.5 l 1.5 4.5 l 4.5 1.5 l -4.5 1.5 l -1.5 4.5 l -1.5 -4.5 l -4.5 -1.5 z"/>
      <path d="M 40 36 l 1.5 -4.5 l 1.5 4.5 l 4.5 1.5 l -4.5 1.5 l -1.5 4.5 l -1.5 -4.5 l -4.5 -1.5 z"/>
    </g>
  </svg>`;
}
function setMood(svg, mood, extra = []) {
  if (!svg) return;
  const keep = ['mascot', ...extra];
  for (const c of [...svg.classList]) if (!keep.includes(c) && !['happy', 'squish'].includes(c)) svg.classList.remove(c);
  if (mood) svg.classList.add(mood);
}
function burst(svg, cls = 'happy') {
  svg.classList.remove(cls); void svg.getBoundingClientRect(); svg.classList.add(cls);
  setTimeout(() => svg.classList.remove(cls), 800);
}
function hearts(el, n = 6, chars = ['🧡', '✨', '💛', '🧡', '⭐']) {
  const r = el.getBoundingClientRect();
  for (let i = 0; i < n; i++) {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = chars[Math.floor(Math.random() * chars.length)];
    h.style.left = (r.left + r.width / 2 - 11 + (Math.random() - .5) * r.width * .5) + 'px';
    h.style.top = (r.top + window.scrollY + r.height * .35) + 'px';
    h.style.position = 'absolute';
    h.style.setProperty('--dx', ((Math.random() - .5) * 120) + 'px');
    h.style.animationDelay = (i * 60) + 'ms';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 1700);
  }
}

// ---------- sound & haptics ----------
let audio = null, soundOn = true;
try { soundOn = localStorage.getItem('deck-sound') !== 'off'; } catch {}
function unlockAudio() { if (!audio) try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch {} if (audio && audio.state === 'suspended') audio.resume(); }

    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i * 0.11;

    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + 0.4);

const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };
document.addEventListener('pointerdown', unlockAudio, { once: false, passive: true });

// ---------- helpers ----------
const fmtTok = n => n >= 1e9 ? (n / 1e9).toFixed(1) + 'B' : n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(Math.round(n));
const fmtUsd = n => n >= 100 ? '$' + Math.round(n) : '$' + n.toFixed(2);
function ago(ts) {
  if (!ts) return '';
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 10) return 'now'; if (s < 60) return Math.floor(s) + 's';
  if (s < 3600) return Math.floor(s / 60) + 'm'; if (s < 86400) return Math.floor(s / 3600) + 'h';

}
function dur(ms) { const m = Math.max(0, Math.round(ms / 60000)); return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`; }
const statusOf = s => s.status === 'busy' ? 'busy' : /wait|perm|input/i.test(s.status) ? 'waiting' : 'idle';
const pillText = { busy: 'cooking', idle: 'your turn', waiting: 'needs you!' };

let toastTimer;
function toast(msg, { err = false, output = '' } = {}) {
  const t = $('#toast');
  t.className = 'toast show' + (err ? ' err' : '');
  t.innerHTML = esc(msg) + (output ? `<pre>${esc(output)}</pre>` : '');

  toastTimer = setTimeout(() => t.classList.remove('show'), output ? 7000 : 2200);
}
$('#toast').addEventListener('click', () => $('#toast').classList.remove('show'));

function showPeek(j) {
  if (!j || !j.image) return;
  openSheet(`<h3>👀 ${esc(j.msg.replace(/^👀 /, ''))}</h3><img src="${j.image}" alt="Screenshot of the session" style="width:100%;border-radius:14px;display:block">`);
}
function showDiff(j) {
  if (!j || !j.diff) return;
  const d = j.diff;
  const files = [];
  let cur = null;
  for (const line of d.patch.split('\n')) {
    if (line.startsWith('diff --git')) { cur = { name: line.replace(/^diff --git a\/(.*) b\/.*$/, '$1'), lines: [], add: 0, del: 0 }; files.push(cur); continue; }

    if (line.startsWith('+')) cur.add++; else if (line.startsWith('-')) cur.del++;

    for (let i = 0; i < 12; i++) { ctx.save(); ctx.rotate(i * Math.PI / 6 + performance.now() / 900); ctx.beginPath(); ctx.roundRect(-3, -24, 6, 14, 3); ctx.fill(); ctx.restore(); }
    ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2c1d16'; for (const ex of [-5, 5]) { ctx.beginPath(); ctx.ellipse(ex, -1, 2, s > .5 ? .6 : 2.8, 0, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = '#f4a3a0'; for (const ex of [-9, 9]) { ctx.beginPath(); ctx.ellipse(ex, 4, 2.6, 1.6, 0, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  }
  function hud() { $('#gScore').textContent = score; $('#gLives').textContent = '🧡'.repeat(lives) || '💔'; }
  function frame(now) {
    if (!running) return;
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    const speed = 1 + (now - t0) / 30000 + score / 120;
    px += (tx - px) * Math.min(1, dt * 14);
    if ((spawnIn -= dt) <= 0) { const k = pick(); items.push({ x: 20 + Math.random() * (W - 40), y: -20, vy: (110 + Math.random() * 80) * speed, k }); spawnIn = .75 / speed; }
    ctx.clearRect(0, 0, W, H);
    ctx.font = '26px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const py = H - 40;
    items = items.filter(it => {
      it.y += it.vy * dt;
      if (Math.hypot(it.x - px, it.y - py) < 32) {
        const [e, pts] = it.k;
        if (e === '🐛') { lives--; buzz(40); } else if (e === '🧡') { lives = Math.min(5, lives + 1); buzz(10); } else { score += pts; buzz(6); }
        squish = 1; hud(); return false;
      }
      if (it.y > H + 20) return false;
      ctx.fillText(it.k[0], it.x, it.y); return true;
    });
    squish = Math.max(0, squish - dt * 4);
    drawPet(px, py, squish);
    if (lives <= 0) return end();
    raf = requestAnimationFrame(frame);
  }
  async function end() {
    running = false;
    const best = cfg.highScore || 0, record = score > best;
    $('#gOver').hidden = false;
    $('#gOver').innerHTML = `<b>${score}</b><div>${record ? '🏆 NEW RECORD!' : `best: ${best}`}</div><button id="gStart">Play again</button>`;
    $('#gStart').addEventListener('click', start);
    if (record) { confetti(30); chime([523, 659, 784, 1046]); await saveSettings({ highScore: score }); }
  }
  function start() {
    items = []; score = 0; lives = 3; squish = 0; spawnIn = 0; t0 = last = performance.now(); running = true;
    $('#gOver').hidden = true; hud(); unlockAudio(); raf = requestAnimationFrame(frame);
  }
  $('#gStart').addEventListener('click', start);
  ctx.clearRect(0, 0, W, H); drawPet(W / 2, H - 40, 0);
}

// ---------- keyboard shortcuts (iPad with a keyboard, or the laptop) ----------
let currentPid = null;
function setCurrent(el) {
  for (const c of cards.values()) c.classList.toggle('current', c === el);
  currentPid = el ? +el.dataset.pid : null;
  if (el) { el.classList.add('open'); open.add(currentPid); el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
}
const SHORTCUTS = [
  ['1–9', 'pick a session'], ['f', 'focus it on the laptop'], ['p', 'peek at its screen'], ['d', 'diff'], ['g', 'git status'],
  ['c', 'say “continue”'], ['/', 'type to it'], ['Esc', 'close a sheet'], ['n', 'start a Claude'], ['s', 'live screen'],
  ['k', 'search past chats'], ['t', 'focus timer'], ['?', 'this help'],
];
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape') return closeSheet();
  if (e.target.closest('input, textarea')) return;
  const el = currentPid != null ? cards.get(currentPid) : null;
  const pidAct = type => el ? act({ type, pid: currentPid }).then(j => { showPeek(j); showDiff(j); }) : toast('pick a session first (1–9)');
  if (/^[1-9]$/.test(e.key)) { const c = [...$('#sessions').querySelectorAll('.sess')][+e.key - 1]; if (c) setCurrent(c); return; }
  const map = {
    f: () => pidAct('focus'), p: () => pidAct('peek'), d: () => pidAct('diff'), g: () => pidAct('git'),
    c: () => el ? act({ type: 'send', pid: currentPid, text: 'continue' }) : pidAct(),
    '/': () => el ? $('.say input', el).focus() : pidAct(),
    n: openProjects, s: openScreen, t: openTimer, k: () => $('#searchQ').focus(),
    '?': () => openSheet(`<h3>⌨️ Shortcuts</h3><div class="kbd">${SHORTCUTS.map(([k, d]) => `<kbd>${esc(k)}</kbd><span>${esc(d)}</span>`).join('')}</div>`),
  };
  if (map[e.key]) { e.preventDefault(); map[e.key](); }
});

// ---------- activity ----------
function renderLog(evts) {
  const html = (evts || []).slice().reverse().map(e => `<div><span>${esc(e.icon)}</span><span>${esc(e.text)}</span><small>${ago(e.t)}</small></div>`).join('')
    || '<div class="hint" style="margin:0">Things that happen show up here ✨</div>';
  if ($('#log').innerHTML !== html) $('#log').innerHTML = html;
}

// ---------- today recap ----------
function renderToday(u) {
  const x = u.todayExtra || {};
  $('#today').innerHTML = `<div><b>${x.sessions ?? 0}</b><span>sessions</span></div><div><b>${u.today.msgs}</b><span>replies</span></div><div><b>${fmtUsd(u.today.cost)}</b><span>spent</span></div>`;
  const top = u.projects.filter(p => p.today > 0).sort((a, b) => b.today - a.today)[0];
  const hr = x.busiestHour == null ? null : new Date(2000, 0, 1, x.busiestHour).toLocaleTimeString([], { hour: 'numeric' });
  const vibe = u.today.out > 300_000 ? 'absolute machine 🦾' : u.today.out > 100_000 ? 'big day 💪' : u.today.out > 10_000 ? 'nice and steady 🌱' : 'warming up ☕';
  $('#todayLine').textContent = u.today.msgs ? [top && `top: ${top.name}`, hr && `busiest ${hr}`, vibe].filter(Boolean).join(' · ') : 'nothing yet today, go make something ✨';
}

// ---------- hero mood ----------
function renderHero(st) {
  const sessions = st.sessions, busy = sessions.filter(s => statusOf(s) === 'busy');
  const waiting = sessions.filter(s => statusOf(s) === 'waiting');
  const pct = planPct(st) ?? (st.usage.block.budget ? st.usage.block.cost / st.usage.block.budget : 0);
  let svg = $('#hero svg');
  const mood = !sessions.length ? 'sleep' : busy.length ? 'busy' : waiting.length ? 'waiting' : null;
  setMood(svg, mood);
  svg.classList.toggle('stressed', pct > .8);
  const acc = accessoryFor(st.usage.pet.level);
  svg.querySelectorAll('.acc').forEach(g => g.classList.toggle('on', g.dataset.acc === acc));
  svg.style.setProperty('--spin', Math.max(0.6, 3.2 - st.usage.outPerMin / 1500) + 's');
  if (!sessions.length) say('zzz… no sessions open');
  else if (waiting.length) say(`${waiting.length} Claude${waiting.length > 1 ? 's need' : ' needs'} you! 👋`);
  else if (busy.length) say(`${busy.length} Claude${busy.length > 1 ? 's' : ''} cooking 🍳` + (pct > .8 ? ' (budget getting spicy 🌶️)' : ''));
  else say(`all ${sessions.length} idle · your turn ✨`);
}

// ---------- live stream ----------
let es, lastMsg = 0, lastState = null;
function connect() {
  es?.close();
  es = new EventSource('api/events?t=' + encodeURIComponent(token));
  es.onmessage = ev => {
    lastMsg = Date.now();
    const st = JSON.parse(ev.data);
    $('#conn').classList.add('on'); $('#host').textContent = st.host;
    renderUsage(st.usage, st.plan); renderSessions(st.sessions); renderHero(st);
    renderVitals(st.vitals); renderServers(st.servers || []); renderTimer(st.timer);
    renderRecent(st.recent || []); renderMedia(st.media); renderLog(st.events); renderToday(st.usage);
    lastState = st;
  };
  es.onerror = () => { $('#conn').classList.remove('on'); $('#host').textContent = 'reconnecting…'; };
}
connect();
setInterval(() => { if (Date.now() - lastMsg > 8000) { $('#conn').classList.remove('on'); connect(); } }, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastMsg > 3000) connect(); });

// keep the screen awake on the desk (needs https or localhost; silently skipped otherwise)
async function wake() { try { await navigator.wakeLock?.request('screen'); } catch {} }
wake(); document.addEventListener('visibilitychange', () => !document.hidden && wake());
</script>
